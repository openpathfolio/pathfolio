name: Refresh opportunities

# Weekly research, split per scope (US + each live state) into two jobs:
#   verify   → re-check every listing in scope on its official page (own budget)
#   discover → find new programs for this week's topic (own budget)
# Each job writes data/opportunities/sources/research-<job>-<scope>.json. One PR collects all
# results for HUMAN REVIEW. Nothing is published until a maintainer merges it.
# Setup and engines: docs/AUTOMATION.md · Spec: specs/001-research-pipeline-scaling/
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      engine:
        description: "Research engine"
        type: choice
        options: [auto, claude, issue]
        default: auto
      scope:
        description: "Scope: all, US, or a live state code (e.g. TX)"
        type: string
        default: all
      job:
        description: "Which research job"
        type: choice
        options: [both, verify, discover]
        default: both

permissions:
  contents: read

concurrency:
  group: refresh-opportunities
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.engine.outputs.engine }}
      today: ${{ steps.engine.outputs.today }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Choose research engine
        id: engine
        run: |
          choice="${{ inputs.engine || 'auto' }}"
          if [ "$choice" = "auto" ]; then
            if [ "$HAS_CLAUDE" = "true" ]; then choice=claude; else choice=issue; fi
          fi
          if [ "$choice" = "claude" ] && [ "$HAS_CLAUDE" != "true" ]; then
            echo "::error::engine=claude needs secret CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY"; exit 1
          fi
          echo "engine=$choice" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build research matrix
        id: matrix
        run: |
          m=$(node scripts/research-matrix.mjs --scope "${{ inputs.scope || 'all' }}" --job "${{ inputs.job || 'both' }}")
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "$m" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>JSON.parse(s).include.forEach(x=>console.log(`- ${x.job} ${x.scope} (topic: ${x.topic}, max turns ${x.maxTurns})`)))' >> "$GITHUB_STEP_SUMMARY"

  # ---------- Engine: Claude (one job per scope × job) ----------
  research:
    needs: plan
    if: needs.plan.outputs.engine == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OUTPUT: data/opportunities/sources/research-${{ matrix.job }}-${{ matrix.scope }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Research (${{ matrix.job }} · ${{ matrix.scope }})
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            TODAY=${{ needs.plan.outputs.today }}
            SCOPE=${{ matrix.scope }}
            TOPIC=${{ matrix.topic }} (${{ matrix.topicLabel }})
            MAX_NEW=${{ matrix.maxNew }}
            OUTPUT=${{ env.OUTPUT }}

            Follow every instruction in .github/prompts/opportunity-${{ matrix.job }}.md exactly.
            Write only OUTPUT, then run `node scripts/build-opportunities.mjs` and fix OUTPUT until it succeeds.
          claude_args: >-
            --max-turns ${{ matrix.maxTurns }}
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(node scripts/build-opportunities.mjs:*)"
      - name: Validate result
        run: |
          test -f "$OUTPUT" || { echo "::error::$OUTPUT was not written"; exit 1; }
          node scripts/build-opportunities.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.job }}-${{ matrix.scope }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, research]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.engine == 'claude'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download research results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: research-*
          merge-multiple: true
          path: ${{ runner.temp }}/research
      - name: Collect results and note missing jobs
        id: collect
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          RDIR: ${{ runner.temp }}/research
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const missing = [];
            for (const x of JSON.parse(process.env.MATRIX).include) {
              const f = `research-${x.job}-${x.scope}.json`, p = path.join(process.env.RDIR, f);
              if (fs.existsSync(p)) fs.copyFileSync(p, path.join("data/opportunities/sources", f));
              else missing.push(`${x.job}-${x.scope}`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `missing=${missing.join(",")}\n`);
            console.log(missing.length ? "Missing: " + missing.join(", ") : "All research jobs completed");'
      - name: Run source adapters (official feeds/APIs)
        run: node scripts/fetch-opportunities.mjs
      - name: Build, prune, summarize with coverage
        run: |
          node scripts/build-opportunities.mjs --prune \
            --summary "$RUNNER_TEMP/summary.md" \
            --since "${{ needs.plan.outputs.today }}" \
            --missing "${{ steps.collect.outputs.missing }}"
      - name: Open pull request for review
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/refresh-opportunities
          commit-message: "Weekly opportunities refresh (${{ needs.plan.outputs.today }})"
          title: "Weekly opportunities refresh: ${{ needs.plan.outputs.today }}"
          body-path: ${{ runner.temp }}/summary.md
          add-paths: |
            data/opportunities/**
            assets/data/opportunities.js
          labels: data
          delete-branch: true

  # ---------- Engine: Issue (GitHub Copilot coding agent or manual) ----------
  issue:
    needs: plan
    if: needs.plan.outputs.engine == 'issue'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      MATRIX: ${{ needs.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Open weekly research issue
        run: |
          gh label create opportunity-research --color 1f4e8c --description "Weekly opportunity research" --force >/dev/null
          if [ -n "$(gh issue list --label opportunity-research --state open --json number --jq '.[0].number')" ]; then
            echo "A research issue is already open; not creating another."; exit 0
          fi
          {
            echo "> **How to run this week's research**"
            echo "> - **GitHub Copilot:** assign this issue to **Copilot**. It opens a PR. Its firewall must allow the official sites (see docs/AUTOMATION.md)."
            echo "> - **Claude:** add the CLAUDE_CODE_OAUTH_TOKEN secret, then re-run *Refresh opportunities* with engine = claude."
            echo "> - **Manually:** use any AI assistant with web search, following the instructions below."
            echo
            echo "TODAY=${{ needs.plan.outputs.today }}"
            echo
            echo "## Jobs to run (one output file each)"
            echo "$MATRIX" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>JSON.parse(s).include.forEach(x=>console.log(`- [ ] **${x.job}** · SCOPE=${x.scope} · TOPIC=${x.topic} (${x.topicLabel}) · MAX_NEW=${x.maxNew} → \`data/opportunities/sources/research-${x.job}-${x.scope}.json\``)))'
            echo
            echo "Finish with \`node scripts/build-opportunities.mjs\`, then open one PR."
            echo; echo "---"; echo
            cat .github/prompts/opportunity-verify.md
            echo; echo "---"; echo
            cat .github/prompts/opportunity-discover.md
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "Weekly opportunity research: ${{ needs.plan.outputs.today }}" \
            --label opportunity-research --body-file "$RUNNER_TEMP/issue.md"
