name: Refresh opportunities

# Weekly: verify deadlines and discover new programs with live web search, then open a
# pull request for HUMAN REVIEW. Nothing is published until a maintainer merges it.
#
# Research engine (see docs/AUTOMATION.md):
#   claude: runs automatically if repo secret CLAUDE_CODE_OAUTH_TOKEN (Claude Pro/Max
#           subscription, from `claude setup-token`) or ANTHROPIC_API_KEY is set.
#   issue:  otherwise, opens a weekly research issue. Assign it to Copilot (coding agent)
#           or work it manually; that produces the pull request instead.
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      engine:
        description: "Research engine"
        type: choice
        options: [auto, claude, issue]
        default: auto

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: refresh-opportunities
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Choose research engine
        id: engine
        run: |
          choice="${{ inputs.engine || 'auto' }}"
          if [ "$choice" = "auto" ]; then
            if [ "$HAS_CLAUDE" = "true" ]; then choice=claude; else choice=issue; fi
          fi
          if [ "$choice" = "claude" ] && [ "$HAS_CLAUDE" != "true" ]; then
            echo "::error::engine=claude needs secret CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY"; exit 1
          fi
          echo "engine=$choice" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "Research engine: $choice"

      - name: Run source adapters (official feeds/APIs)
        run: node scripts/fetch-opportunities.mjs

      # ---------- Engine: Claude (automatic web research) ----------
      - name: Web research with Claude
        if: steps.engine.outputs.engine == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Today is ${{ steps.engine.outputs.today }}.
            Follow every instruction in .github/prompts/opportunity-research.md exactly.
            Only write data/opportunities/sources/web-research.json, then run
            `node scripts/build-opportunities.mjs` and fix the JSON until it succeeds.
          claude_args: >-
            --max-turns 120
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(node scripts/build-opportunities.mjs:*)"

      - name: Build, prune expired listings, summarize changes
        if: steps.engine.outputs.engine == 'claude'
        run: node scripts/build-opportunities.mjs --prune --summary "$RUNNER_TEMP/summary.md"

      - name: Open pull request for review
        if: steps.engine.outputs.engine == 'claude'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/refresh-opportunities
          commit-message: "Weekly opportunities refresh (${{ steps.engine.outputs.today }})"
          title: "Weekly opportunities refresh: ${{ steps.engine.outputs.today }}"
          body-path: ${{ runner.temp }}/summary.md
          add-paths: |
            data/opportunities/**
            assets/data/opportunities.js
          labels: data, automated
          delete-branch: true

      # ---------- Engine: Issue (for Copilot coding agent or manual work) ----------
      - name: Open weekly research issue
        if: steps.engine.outputs.engine == 'issue'
        run: |
          gh label create opportunity-research --color 1f4e8c --description "Weekly opportunity research" --force >/dev/null
          if [ -n "$(gh issue list --label opportunity-research --state open --json number --jq '.[0].number')" ]; then
            echo "A research issue is already open; not creating another."; exit 0
          fi
          {
            echo "> **How to run this week's research**"
            echo "> - **GitHub Copilot:** assign this issue to **Copilot**. It will open a pull request. Its firewall must allow the official sites (see docs/AUTOMATION.md)."
            echo "> - **Claude:** add the CLAUDE_CODE_OAUTH_TOKEN secret, then re-run the *Refresh opportunities* workflow with engine = claude."
            echo "> - **Manually:** follow the steps below with any AI assistant that has web search, and open a PR."
            echo
            echo "Today is ${{ steps.engine.outputs.today }}."
            echo
            cat .github/prompts/opportunity-research.md
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "Weekly opportunity research: ${{ steps.engine.outputs.today }}" \
            --label opportunity-research --body-file "$RUNNER_TEMP/issue.md"
