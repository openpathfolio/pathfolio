name: Refresh university data

# Monthly: fetch official figures from the College Scorecard (U.S. Dept. of Education) for every
# listed university, suggest notable universities we don't list yet, and open a pull request for
# HUMAN REVIEW. Nothing is published until a maintainer merges it.
# Needs repository secret SCORECARD_API_KEY (free key from https://api.data.gov/signup/).
# Spec: specs/004-university-data-pipeline/ · Docs: docs/AUTOMATION.md
on:
  schedule:
    - cron: "29 11 4 * *"   # 4th of each month, 11:29 UTC
  workflow_dispatch:
    inputs:
      discover:
        description: "Also suggest universities we don't list yet"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: refresh-universities
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch official figures (College Scorecard)
        env:
          SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
        run: |
          if [ -z "$SCORECARD_API_KEY" ]; then echo "::error::Repository secret SCORECARD_API_KEY is not set"; exit 1; fi
          node scripts/fetch-scorecard.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.discover == false) && '--no-discover' || '' }}
      - name: Build and summarize
        run: |
          node scripts/build-universities.mjs --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open pull request for review
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/refresh-universities
          commit-message: "Monthly university data refresh (College Scorecard)"
          title: "Monthly university data refresh: College Scorecard"
          body-path: ${{ runner.temp }}/summary.md
          add-paths: |
            data/universities/**
            assets/data/official.js
          labels: data
          delete-branch: true
