name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: for f in assets/*.js assets/data/*.js assets/data/*/*.js scripts/*.mjs scripts/sources/*.mjs; do node --check "$f"; done
      - name: Validate states, career paths and research targets
        run: node scripts/validate-data.mjs
      - name: Validate opportunity data
        run: node scripts/build-opportunities.mjs --check
